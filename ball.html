<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N.E.K.O</title>
    <style>
      html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
      button { position:fixed; left:15px; top:15px; width:58px; height:58px; padding:0; border:0; border-radius:0; outline:0; background-color:transparent; background-image:var(--ball-bounce); background-repeat:no-repeat; background-size:2088px 58px; cursor:grab; opacity:0; }
      button.ready { opacity:1; }
      button:active { cursor:grabbing; }
      button.appearing { background-image:var(--ball-appear); background-size:1392px 58px; animation:appear 380ms steps(23,end) both; }
      button.bouncing { animation:bounce 760ms steps(35,end) both; }
      @keyframes appear { from { background-position:0 0; } to { background-position:-1334px 0; } }
      @keyframes bounce { from { background-position:0 0; } to { background-position:-2030px 0; } }
      @media (prefers-reduced-motion:reduce) { button.appearing, button.bouncing { animation:none; } }
    </style>
  </head>
  <body><button type="button" aria-label="恢复聊天" data-compact-chat-ball></button></body>
</html>
